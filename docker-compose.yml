services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: kanban
      POSTGRES_PASSWORD: kanban
      POSTGRES_DB: kanbanboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: "1.3.0"
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: kanban
      DB_PASSWORD: kanban
      DB_NAME: kanbanboard
      PORT: 8080
      STATIC_DIR: /app/static

  mcp:
    build:
      context: .
      dockerfile: backend/Dockerfile.mcp
    profiles:
      - mcp
    depends_on:
      - app
    stdin_open: true
    environment:
      KANBAN_API_URL: http://app:8080
      KANBAN_API_TOKEN: ""  # set via KANBAN_API_TOKEN env var or override

volumes:
  pgdata:
